[Unit]
Description=Serviço Acervo RNCD (Gunicorn + Uvicorn via uv)
After=network.target

[Service]
Type=simple
User=webapp
WorkingDirectory=/var/webapp/acervo/acervo-rncd

# Comando de inicialização do Gunicorn utilizando o ambiente do uv
ExecStart=/var/webapp/acervo/acervo-rncd/.venv/bin/gunicorn config.wsgi:application --workers 2 \
          --bind 127.0.0.1:9003 \
          --access-logfile - \
          --error-logfile -

# Politica de Auto-Restart
Restart=on-failure
RestartSec=5s

# ======================================================
# LIMITES DE RECURSOS DO SYSTEMD (CGROUPS)
# ======================================================

# Limite estrito de memória RAM total para o Gunicorn + Workers
MemoryMax=1G
MemoryHigh=1G

# Limite de CPU (ex: 200% = no máximo 2 núcleos de CPU cheios)
CPUQuota=200%

# Limite de arquivos abertos (importante para conexões HTTP e banco de dados)
LimitNOFILE=65536

# Proteções de Segurança
ProtectSystem=full
PrivateTmp=true

[Install]
WantedBy=multi-user.target
