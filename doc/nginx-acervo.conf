upstream gunicorn_acervo {
    # For a TCP configuration:
    server 127.0.0.1:9003 fail_timeout=0;

    # Reaproveita conexões com o Gunicorn (requer proxy_http_version 1.1
    # e Connection "" no location de proxy, abaixo).
    keepalive 16;
}

server {
    client_max_body_size 20M;
    server_name acervo.rncd.org;

    error_log /var/webapp/acervo/logs/nginx-error.log;

    location /media/ {
        alias /var/webapp/acervo/acervo-rncd/media/;
    }

    # HSTS controlado aqui (e não no Django) para cobrir todas as respostas,
    # inclusive os estáticos servidos direto pelo nginx. "always" garante o
    # header também em respostas de erro.
    #
    # ATENÇÃO: algumas versões do options-ssl-nginx.conf do Certbot (incluído
    # abaixo) já adicionam este mesmo header. Verifique com:
    #   grep -i strict-transport-security /etc/letsencrypt/options-ssl-nginx.conf
    # Se já estiver lá, REMOVA a linha abaixo para não duplicar o header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ {
        alias /var/webapp/acervo/acervo-rncd/staticfiles/;
        expires 30d;
    }

    location / {
        # checks for static file, if not found proxy to app
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        # Mantém a conexão com o upstream viva (keepalive no bloco upstream).
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
        proxy_pass   http://gunicorn_acervo;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/acervo.rncd.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/acervo.rncd.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = acervo.rncd.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name acervo.rncd.org;
    return 404; # managed by Certbot
}
